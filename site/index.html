<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Apollo — виртуальный тур</title>
  <meta name="description" content="Виртуальный 3D-тур по семейному развлекательному центру Apollo в Актау, ТРЦ Сая Парк (Saya Park): батуты, сухие бассейны, зиплайн, игровые автоматы и VIP-комнаты для праздников.">
  <meta name="theme-color" content="#0b0820">

  <!--
    ЗАМЕНИТЕ https://example.com на адрес вашего сайта (3 места ниже).
    Для превью в WhatsApp/Telegram ссылка на картинку должна быть полной (с https://).
  -->
  <link rel="canonical" href="https://example.com/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Apollo">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Apollo — виртуальный тур">
  <meta property="og:description" content="Прогуляйтесь по Apollo, не выходя из дома. Актау, Сая Парк.">
  <meta property="og:url" content="https://example.com/">
  <meta property="og:image" content="https://example.com/assets/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Apollo — виртуальный тур, Актау, Сая Парк">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;700&display=swap">

  <link rel="stylesheet" href="vendor/pannellum/pannellum.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app">

  <!-- Панорама -->
  <div id="pano" class="pano" aria-label="Панорама"></div>

  <!-- Верхняя панель -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="7" fill="currentColor"/><ellipse cx="16" cy="16" rx="14" ry="5" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-25 16 16)"/></svg>
      </span>
      <div class="brand-text">
        <span class="brand-name" data-venue="name">Apollo</span>
        <span id="sceneTitle" class="scene-title"></span>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="langBtn" class="icon-btn lang-btn" type="button" hidden data-i18n-aria="language"></button>
      <button id="infoBtn" class="icon-btn" type="button" data-i18n-aria="info" data-i18n-title="info">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.01"/></svg>
      </button>
      <button id="fsBtn" class="icon-btn" type="button" data-i18n-aria="fullscreen" data-i18n-title="fullscreen">
        <svg class="i-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg class="i-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
    </div>
  </header>

  <!-- Нижняя навигация -->
  <nav class="scene-nav" aria-label="Навигация по локациям">
    <button id="prevBtn" class="icon-btn" type="button" data-i18n-aria="prev" data-i18n-title="prev">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="listBtn" class="pill-btn" type="button" aria-controls="drawer" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
      <span data-i18n="locations">Локации</span>
      <span id="counter" class="counter"></span>
    </button>
    <button id="nextBtn" class="icon-btn" type="button" data-i18n-aria="next" data-i18n-title="next">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>

  <!-- Список локаций -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="drawer" class="drawer" aria-hidden="true" aria-labelledby="drawerTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="drawer-head">
      <h2 id="drawerTitle" data-i18n="allLocations">Все локации</h2>
      <button class="icon-btn ghost" type="button" data-close data-i18n-aria="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="sceneList" class="scene-list"></div>
  </aside>

  <!-- О заведении -->
  <aside id="infoCard" class="card info-card" aria-hidden="true" aria-labelledby="infoTitle">
    <div class="card-head">
      <div>
        <h2 id="infoTitle" data-venue="name">Apollo</h2>
        <p class="muted" data-venue="tagline"></p>
      </div>
      <button class="icon-btn ghost" type="button" data-close data-i18n-aria="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <dl class="contacts">
      <div class="contact-row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <div><dt data-i18n="address">Адрес</dt><dd data-venue="address"></dd></div>
      </div>
      <div class="contact-row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <div><dt data-i18n="hours">Часы работы</dt><dd data-venue="hours"></dd></div>
      </div>
      <div class="contact-row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
        <div><dt data-i18n="phone">Телефон</dt><dd><a data-venue-phone></a></dd></div>
      </div>
    </dl>
    <div class="card-actions">
      <a class="btn btn-primary" data-venue-map target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>
        <span data-i18n="openMap">Открыть в 2ГИС</span>
      </a>
      <a class="btn btn-ghost" data-venue-call>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
        <span data-i18n="call">Позвонить</span>
      </a>
      <a class="btn btn-ghost btn-wa" data-venue-whatsapp target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 8.5c0 3.5 2.5 6.5 6.5 6.5l1-1.5-2-1-1 1c-1.3-.5-2.5-1.7-3-3l1-1-1-2z" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="whatsapp">WhatsApp</span>
      </a>
      <a class="btn btn-ghost btn-ig" data-venue-instagram target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5v.01"/></svg>
        <span data-i18n="instagram">Instagram</span>
      </a>
    </div>
  </aside>

  <!-- Карточка инфо-метки -->
  <aside id="hsCard" class="card hs-card" aria-hidden="true" aria-live="polite">
    <div class="card-head">
      <h2 id="hsTitle"></h2>
      <button class="icon-btn ghost" type="button" data-close data-i18n-aria="close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p id="hsDesc" class="muted"></p>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Приветственный экран -->
  <section id="welcome" class="welcome" aria-labelledby="welcomeTitle">
    <div class="welcome-inner">
      <div class="welcome-logo" aria-hidden="true">
        <svg viewBox="0 0 64 64"><defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><circle cx="32" cy="32" r="14" fill="url(#wg)"/><ellipse cx="32" cy="32" rx="29" ry="10" fill="none" stroke="#ff8a3d" stroke-width="3" transform="rotate(-25 32 32)"/><circle cx="56" cy="20" r="3" fill="#ff8a3d"/></svg>
      </div>
      <p class="welcome-kicker" data-venue="tagline">Семейный развлекательный центр</p>
      <h1 id="welcomeTitle" class="welcome-title" data-venue="name">Apollo</h1>
      <p class="welcome-sub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span data-venue="subtitle">Актау, Сая Парк</span>
      </p>
      <button id="startBtn" class="btn btn-primary btn-xl" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></svg>
        <span data-i18n="start">Начать тур</span>
      </button>
      <p id="welcomeStatus" class="welcome-status" aria-live="polite"></p>
      <div class="welcome-contacts">
        <span data-venue="address"></span>
        <a data-venue-phone></a>
        <a data-venue-map target="_blank" rel="noopener" data-i18n="openMap">Открыть в 2ГИС</a>
        <a data-venue-whatsapp target="_blank" rel="noopener" data-i18n="whatsapp">WhatsApp</a>
        <a data-venue-instagram target="_blank" rel="noopener" data-i18n="instagram">Instagram</a>
      </div>
    </div>
  </section>
</div>

<noscript><p style="padding:24px;color:#fff;background:#0b0820">Для просмотра виртуального тура включите JavaScript.</p></noscript>

<script src="vendor/pannellum/pannellum.js"></script>
<script src="js/app.js"></script>
</body>
</html>
